# Nginx-site voor de publieke portfolio op vkhub.org
# Komt in de LXC op: /etc/nginx/sites-available/portfolio
# HTTPS wordt gedaan door Nginx Proxy Manager; deze server luistert alleen op poort 80.

server {
    listen 80 default_server;
    server_name vkhub.org www.vkhub.org _;

    root /var/www/portfolio/site;
    index index.html;

    server_tokens off;
    access_log off;

    # Echte bezoekers-IP doorkrijgen van Nginx Proxy Manager
    # VERVANG door het IP-adres van je Nginx Proxy Manager
    set_real_ip_from NPM-IP-HIER;
    real_ip_header X-Forwarded-For;

    # Beveiligingsheaders (de pagina gebruikt geen scripts en niets van buitenaf)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; font-src data:; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Geen verborgen bestanden tonen (zoals .git)
    location ~ /\. {
        deny all;
    }
}
